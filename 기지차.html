<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>좀비 아포칼립스 무한 열차</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background-color: #283c28;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="700"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- 게임 상태 및 변수 설정 ---
    const WIDTH = 400;
    const HEIGHT = 700;
    
    let trainRect = { x: 120, y: 250, w: 160, h: 350 };
    let controlRect = { x: 120, y: 250, w: 160, h: 50 };
    let player = { x: 200, y: 450, radius: 12, speed: 4.0 };
    
    let isMoving = false;
    let trainSpeed = 0.0;
    const maxSpeed = 8.0;
    const inertia = 0.05;
    const acceleration = 0.1;
    
    let food = 10;
    let water = 10;
    let fuel = 20.0;
    
    let scrollY = 0.0;
    let lastTickTime = performance.now();
    let station = null;
    let scenery = [];

    let actionBtn = { x: WIDTH - 110, y: 550, w: 90, h: 90, radius: 15 };
    // 기차 내부 우측에 생길 탐색(문 열기) 버튼
    let exploreBtn = { x: 170, y: 350, w: 100, h: 60, radius: 10 };
    
    let joy = { baseX: 80, baseY: 580, stickX: 80, stickY: 580, radius: 50, active: false, pointerId: null };

    // --- 초기 배경 나무 생성 ---
    for (let i = 0; i < 15; i++) {
        spawnTree(Math.random() * HEIGHT);
    }

    function spawnTree(startY) {
        let x = Math.random() < 0.5 ? Math.random() * 80 : 300 + Math.random() * 100;
        scenery.push({ x: x, y: startY, w: 30, h: 30 });
    }

    // --- 입력 처리 ---
    let pointers = {};

    canvas.addEventListener('pointerdown', (e) => {
        pointers[e.pointerId] = e;
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        let x = (e.clientX - rect.left) * scaleX;
        let y = (e.clientY - rect.top) * scaleY;

        // 1. 완벽 주차 시 나타나는 '탐색하기' 버튼 터치 확인
        let isParked = (!isMoving && trainSpeed === 0 && station && 
                        trainRect.y >= station.y && trainRect.y <= station.y + station.h);
        
        if (isParked && x >= exploreBtn.x && x <= exploreBtn.x + exploreBtn.w &&
            y >= exploreBtn.y && y <= exploreBtn.y + exploreBtn.h) {
            
            if (station.name === "소규모 구역") {
                food += 2; water += 2; fuel = Math.min(20.0, fuel + 5);
                alert("🚪 문을 열고 소규모 구역을 탐색했습니다!\n[획득] 식량 +2, 물 +2, 연료 +5");
            } else {
                food += 5; water += 5; fuel = Math.min(20.0, fuel + 10);
                alert("🚪 마트를 털었습니다!\n[획득] 식량 +5, 물 +5, 연료 +10");
            }
            station = null; // 파밍 끝난 구역 소모
            return;
        }

        // 2. 액션 버튼(출발/정지) 터치 확인
        let isNearControl = (player.x > controlRect.x && player.x < controlRect.x + controlRect.w &&
                             player.y > controlRect.y && player.y < controlRect.y + controlRect.h);
        
        if (isNearControl && x >= actionBtn.x && x <= actionBtn.x + actionBtn.w &&
            y >= actionBtn.y && y <= actionBtn.y + actionBtn.h) {
            isMoving = !isMoving;
            return; 
        }

        // 3. 조이스틱 터치 확인
        let dist = Math.hypot(x - joy.baseX, y - joy.baseY);
        if (!joy.active && dist <= joy.radius * 1.5) {
            joy.active = true;
            joy.pointerId = e.pointerId;
            updateJoystick(x, y);
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if (joy.active && e.pointerId === joy.pointerId) {
            let rect = canvas.getBoundingClientRect();
            let x = (e.clientX - rect.left) * (canvas.width / rect.width);
            let y = (e.clientY - rect.top) * (canvas.height / rect.height);
            updateJoystick(x, y);
        }
    });

    function handlePointerEnd(e) {
        delete pointers[e.pointerId];
        if (joy.pointerId === e.pointerId) {
            joy.active = false;
            joy.stickX = joy.baseX;
            joy.stickY = joy.baseY;
            joy.pointerId = null;
        }
    }
    canvas.addEventListener('pointerup', handlePointerEnd);
    canvas.addEventListener('pointercancel', handlePointerEnd);

    function updateJoystick(x, y) {
        let dx = x - joy.baseX;
        let dy = y - joy.baseY;
        let dist = Math.hypot(dx, dy);
        if (dist > joy.radius) {
            let angle = Math.atan2(dy, dx);
            joy.stickX = joy.baseX + Math.cos(angle) * joy.radius;
            joy.stickY = joy.baseY + Math.sin(angle) * joy.radius;
        } else {
            joy.stickX = x;
            joy.stickY = y;
        }
    }

    // --- 게임 업데이트 로직 ---
    function update() {
        if (joy.active) {
            let dx = (joy.stickX - joy.baseX) / joy.radius;
            let dy = (joy.stickY - joy.baseY) / joy.radius;
            player.x += dx * player.speed;
            player.y += dy * player.speed;
        }

        player.x = Math.max(trainRect.x + player.radius, Math.min(trainRect.x + trainRect.w - player.radius, player.x));
        player.y = Math.max(trainRect.y + player.radius, Math.min(trainRect.y + trainRect.h - player.radius, player.y));

        if (isMoving) {
            if (trainSpeed < maxSpeed) trainSpeed += acceleration;
            if (fuel > 0) {
                fuel -= 0.02;
            } else {
                fuel = 0;
                isMoving = false;
            }
        } else {
            if (trainSpeed > 0) {
                trainSpeed -= inertia;
                // 미세한 소수점 오차로 멈추지 않는 현상 방지
                if (trainSpeed < 0.1) trainSpeed = 0;
            }
        }

        if (trainSpeed > 0) {
            scrollY += trainSpeed;
            
            for (let i = 0; i < scenery.length; i++) {
                scenery[i].y += trainSpeed;
            }
            scenery = scenery.filter(t => t.y < HEIGHT + 50);
            while (scenery.length < 15) {
                spawnTree(Math.random() * -50 - 10);
            }

            if (station) {
                station.y += trainSpeed;
                if (station.y > HEIGHT + 100) {
                    station = null;
                }
            }
        }

        let currentTime = performance.now();
        if (currentTime - lastTickTime >= 5000 && isMoving) {
            lastTickTime = currentTime;
            if (!station) {
                let rollSmall = Math.random() < 0.30;
                let rollLarge = Math.random() < 0.05;
                if (rollSmall && rollLarge) rollLarge = false;
                
                if (rollSmall) {
                    station = { name: "소규모 구역", x: 290, y: -200, w: 100, h: 100 };
                } else if (rollLarge) {
                    station = { name: "대규모 구역", x: 290, y: -200, w: 140, h: 140 };
                }
            }
        }
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // 1. 철로
        ctx.fillStyle = "#505050";
        ctx.fillRect(140, 0, 10, HEIGHT);
        ctx.fillRect(250, 0, 10, HEIGHT);
        
        ctx.fillStyle = "#8B4513";
        let tieSpacing = 40;
        let offset = Math.floor(scrollY) % tieSpacing;
        for (let y = -tieSpacing + offset; y < HEIGHT; y += tieSpacing) {
            ctx.fillRect(130, y, 140, 10);
        }

        // 2. 바깥 풍경
        ctx.fillStyle = "#146414";
        for (let tree of scenery) {
            ctx.beginPath();
            ctx.ellipse(tree.x + tree.w/2, tree.y + tree.h/2, tree.w/2, tree.h/2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 3. 정거장 및 '정차 구간 가이드라인'
        if (station) {
            ctx.fillStyle = "#c89632";
            ctx.fillRect(station.x, station.y, station.w, station.h);
            ctx.fillStyle = "#000";
            ctx.font = "bold 16px 'Malgun Gothic', sans-serif";
            ctx.fillText(station.name, station.x, station.y - 10);

            // 정거장 옆 철로 위에 초록색 점선으로 '주차 구역' 표시
            ctx.strokeStyle = "rgba(0, 255, 0, 0.6)";
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.strokeRect(120, station.y, 160, station.h);
            ctx.setLineDash([]);
        }

        // 4. 기차 및 기차 내부
        ctx.fillStyle = "#787878";
        ctx.fillRect(trainRect.x, trainRect.y, trainRect.w, trainRect.h);
        
        ctx.fillStyle = "#3296FF"; // 조작부
        ctx.fillRect(controlRect.x, controlRect.y, controlRect.w, controlRect.h);

        // 5. 완벽 주차 판정 및 탐색(문 열림) 버튼 생성
        let isParked = (!isMoving && trainSpeed === 0 && station && 
                        trainRect.y >= station.y && trainRect.y <= station.y + station.h);
        
        if (isParked) {
            // 주차 성공 시 기차 우측(정거장 쪽) 문이 열리는 시각 효과
            ctx.fillStyle = "#FFD700";
            roundRect(ctx, exploreBtn.x, exploreBtn.y, exploreBtn.w, exploreBtn.h, exploreBtn.radius, true, false);
            ctx.fillStyle = "#000";
            ctx.font = "bold 18px 'Malgun Gothic', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🚪 탐색하기", exploreBtn.x + exploreBtn.w / 2, exploreBtn.y + exploreBtn.h / 2);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
        }

        // 6. 플레이어
        ctx.fillStyle = "#FF3232";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // 7. 상단 UI
        ctx.fillStyle = "#FFF";
        ctx.font = "18px 'Malgun Gothic', sans-serif";
        ctx.fillText(`🍔: ${food}`, 10, 30);
        ctx.fillText(`💧: ${water}`, 70, 30);
        ctx.fillText(`⛽: ${fuel.toFixed(1)}`, 130, 30);
        
        // 디버그용 속도계
        ctx.font = "14px 'Malgun Gothic', sans-serif";
        ctx.fillText(`속도: ${Math.floor(trainSpeed * 10)} km/h`, 10, 60);

        // 8. 모바일 조이스틱
        ctx.strokeStyle = "rgba(150, 150, 150, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(joy.baseX, joy.baseY, joy.radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "rgba(200, 200, 200, 0.8)";
        ctx.beginPath();
        ctx.arc(joy.stickX, joy.stickY, joy.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // 9. 조작부 액션 버튼
        let isNearControl = (player.x > controlRect.x && player.x < controlRect.x + controlRect.w &&
                             player.y > controlRect.y && player.y < controlRect.y + controlRect.h);
        
        if (isNearControl) {
            ctx.fillStyle = isMoving ? "#FF6464" : "#64FF64";
            roundRect(ctx, actionBtn.x, actionBtn.y, actionBtn.w, actionBtn.h, actionBtn.radius, true, false);
            
            ctx.fillStyle = "#000";
            ctx.font = "bold 20px 'Malgun Gothic', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(isMoving ? "브레이크" : "출발", actionBtn.x + actionBtn.w / 2, actionBtn.y + actionBtn.h / 2);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();

</script>
</body>
</html>
